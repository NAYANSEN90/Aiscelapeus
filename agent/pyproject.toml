[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiscelapeus"
version = "0.1.0"
description = "Voice-first emergency triage agent (LiveKit + Moss)"
requires-python = ">=3.11"
dependencies = [
    # Pinned to what is installed and tested. 1.8.1 was declared while 1.8.2 was
    # installed, so the local green signal came from a version CI would not have
    # used - the same "green from a dependency the gate does not have" trap
    # docs/evidence/2026-09-17-spike0b-livekit-installed.md records, inverted.
    "livekit-agents==1.8.2",
    # One plugin per surviving vendor. Deepgram covers STT *and* TTS (Aura-2),
    # and Google is the Gemini adapter - verified against the installed package:
    # `google.LLM(*, model, api_key, temperature, ...)` reports provider
    # "Gemini", and `deepgram.TTS(*, model, encoding, sample_rate, api_key)` has
    # no voice_id parameter at all.
    "livekit-plugins-deepgram",
    "livekit-plugins-google",
    # SOAP generation calls the same provider directly after the voice session;
    # declare the client rather than relying on the LiveKit plugin's transitive
    # dependency graph to keep that import available.
    "google-genai",
    "livekit-plugins-silero",
    # Removed, and this was a CI break rather than untidiness: elevenlabs and
    # openai are the two vendors dropped in docs/WORKLOG.md Session 2, neither
    # is installed, and neither is imported any more - while google, which
    # main.py now imports, was not declared at all. `pip install -e ".[dev]"`
    # would have installed the wrong plugin set and errored at test collection.
    # turn-detector is also gone: nothing in aiscelapeus/ imports it.
    "moss>=1.11.0",
    # `aiscelapeus/harness.py` reads its scenario files with it. The harness
    # ships inside the runtime package rather than under tests/, so PyYAML is a
    # runtime dependency of that package whatever its usage pattern - it was
    # only ever declared under `dev`, which made `pip install aiscelapeus` build
    # something whose `--headless` entrypoint raises on first use.
    #
    # The lazy import inside `load_scenario` stays: it fails with a HarnessError
    # naming the fix rather than an ImportError at module load, which is the
    # better failure for anyone running an older install. This declaration is
    # what stops that path being reached in the first place.
    "pyyaml>=6.0",
    # NOT a direct dependency by choice - it arrives transitively via
    # livekit-agents regardless (Spike 0). Declaring it would state an intent to
    # call OpenAI, which Session 2 decided against.
    "python-dotenv>=1.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "respx>=0.21",
    # pyyaml is NOT repeated here: it moved to `dependencies` above, because
    # aiscelapeus/harness.py imports it. Listing it in both places would be two
    # answers to "is this a runtime dependency", and the dev extra would mask a
    # regression in the runtime declaration.
    "mypy>=1.11",
    # Stubs only, so it stays a dev concern even though pyyaml itself is not.
    "types-PyYAML",
]

# Building the voice test corpus: formant-preserving pitch shift, time-stretch,
# ambient mixing and WAV I/O. Deliberately NOT in `dev`, and never in the
# runtime dependency list - these are needed only by
# `scripts/build_corpus.py`, which runs once to produce committed artefacts.
# The default `pytest` run reads the committed manifest.json and imports none of
# this, so the hermetic suite stays installable without a compiler toolchain.
#
# ELEVENLABS IS NOT LISTED HERE, AND THAT IS DELIBERATE.
# `scripts/synthesize_voice.py` calls the ElevenLabs REST API over urllib - no
# SDK, no package - so there is nothing to declare. Stating it another way: the
# note above about elevenlabs and openai being dropped as vendors in WORKLOG
# Session 2 remains true of this project's dependency graph. The corpus script
# reaches a vendor at generation time the way `fetch_beds.py` reaches Freesound
# and `build_corpus.py` reaches Deepgram; none of them is imported by
# `aiscelapeus/`, and none runs in the test suite.
#
# Why ElevenLabs at all, when Deepgram is the runtime TTS: Aura-2 has no
# emotion control - no SSML, no pitch, only `speed` 0.7-1.5 - so it cannot
# perform a panicked caller. See synthesize_voice.py's module docstring.
audio = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aiscelapeus*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A warning in a safety-critical path is a defect, not a note.
filterwarnings = [
    "error",
    # The one exemption, and it is narrow by design. conftest's `_no_real_dotenv`
    # warns when a dotenv exists at the repo root: the suite is hermetic, but a
    # newly-written test that reads the ambient environment would pass on that
    # machine and fail on a runner. Under a bare `error` that advisory would fail
    # the whole suite for any developer who keeps a .env - making the hermetic
    # check itself the reason to distrust the suite. Scoped to its own class so
    # nothing else is widened. CI has no dotenv, so it never fires there.
    "default::tests.conftest._HermeticEnvironmentWarning",
]
markers = [
    "contract: golden-fixture tests shared across the Python/TypeScript boundary",
    "infra: requires real external infrastructure (Moss, Redis, Qdrant); not in the blocking gate",
]

# ---------------------------------------------------------------------- mypy
#
# Starting point, chosen to be green on the code as it stands rather than to be
# maximal. Everything switched off below is listed with the reason, so the debt
# is visible in the config instead of hidden behind a blanket `ignore_errors`.
#
# Deliberately NOT enabled yet, each one a real follow-up:
#   - `strict = true` / `disallow_untyped_defs`: the test suite and the
#     LiveKit-facing entrypoints have untyped defs; turning this on today
#     produces a wall of errors that would be silenced rather than fixed.
#   - `disallow_any_explicit`: telemetry.py and the ports use `Any` at the
#     vendor boundary on purpose.
[tool.mypy]
python_version = "3.11"
files = ["aiscelapeus"]
# The checks that catch real defects, on from the start.
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
no_implicit_optional = true
check_untyped_defs = true
# Keep the suppressions below honest: an unused per-module override is an error.
warn_unused_configs = true
# Required for the narrow NumPy override below to apply to its `.pyi` files;
# without it mypy follows the stub despite `follow_imports = "skip"`.
follow_imports_for_stubs = true

# `warn_unreachable` is OFF, and this is the one suppression that is not about
# missing stubs. It flags the deliberate `isinstance` guards in
# retrieval.py's `__post_init__`: those fields are annotated `str`/`int`, so
# from mypy's view the guard branch cannot run - but the values arrive from a
# live STT event, where a missing transcript really does arrive as None. The
# guard converts an AttributeError into the loggable ValueError the type
# promises. Enabling this check would demand deleting runtime validation at a
# system boundary to satisfy a static assumption that the boundary violates,
# which is backwards for a safety-critical path. Revisit if those boundary
# types are ever narrowed at the edge (see CLAUDE.md, "single responsibility at
# the edges").

# The vendor SDKs ship no type information. This is missing *stubs*, not a
# defect in this repo's code, and it is scoped to the named packages so a
# genuinely mistyped first-party import is still reported.
[[tool.mypy.overrides]]
module = [
    "livekit.*",
    "openai.*",
    "moss.*",
    "opentelemetry.exporter.*",
]
ignore_missing_imports = true

# NumPy is not imported by first-party runtime code; it is an implementation
# dependency of LiveKit. NumPy 2.5 installs only on Python >=3.12 and its stubs
# use PEP 695 syntax unconditionally, while this package deliberately checks
# its own Python 3.11 surface. Do not let a transitive vendor stub make that
# first-party target impossible to parse. This is scoped to NumPy rather than
# skipping LiveKit, so our calls against LiveKit's typed public API remain
# checked (that check has found real runtime breaks in this repository).
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

# REAL DEBT, not a stub gap. `_CompactConsoleExporter` is duck-typed against the
# OTel `SpanExporter` interface but does not subclass it, so passing it to
# `SimpleSpanProcessor` is an `arg-type` error. The fix is one line in
# telemetry.py (inherit from `SpanExporter`) and belongs to whoever owns that
# module - it is deliberately recorded here, narrowed to a single error code on
# a single module, so the gate is green without the defect becoming invisible.
[[tool.mypy.overrides]]
module = "aiscelapeus.telemetry"
disable_error_code = ["arg-type"]
