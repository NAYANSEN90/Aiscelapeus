[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiscelapeus"
version = "0.1.0"
description = "Voice-first emergency triage agent (LiveKit + Moss)"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents==1.8.1",
    "livekit-plugins-deepgram",
    "livekit-plugins-elevenlabs",
    "livekit-plugins-openai",
    "livekit-plugins-silero",
    "livekit-plugins-turn-detector",
    "moss>=1.11.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "respx>=0.21",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aiscelapeus*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A warning in a safety-critical path is a defect, not a note.
filterwarnings = ["error"]
markers = [
    "contract: golden-fixture tests shared across the Python/TypeScript boundary",
    "infra: requires real external infrastructure (Moss, Redis, Qdrant); not in the blocking gate",
]
