name: Release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  artifacts:
    name: downloadable artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Python wheel
        working-directory: agent
        run: |
          python -m pip install build
          python -m build
      - name: Build standalone web server
        working-directory: web
        run: |
          npm ci
          npm run build
          cp -R public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          tar -C .next/standalone -czf ../aiscelapeus-web.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: aiscelapeus-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            agent/dist/*
            aiscelapeus-web.tar.gz

  containers:
    name: publish ${{ matrix.component }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [agent, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
