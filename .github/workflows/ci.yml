name: CI

# The register marked requirements BUILT with "CI-asserted" evidence while no
# CI existed. Everything asserted here is asserted by something that runs.
#
# That claim was itself untrue until 17 Sept 2026: of the five jobs declared
# here, two targeted files that did not exist (`meta`, `harness`) and two
# passed while collecting zero tests (`contract`, and `web`'s test step via
# --passWithNoTests). A job that passes vacuously is worse than no job, because
# it launders an absence of evidence into a green tick.
#
# What this workflow asserts NOW, and nothing more:
#   agent - mypy typechecks aiscelapeus/, and the hermetic pytest suite runs.
#   meta  - every test in tests/unit names its falsifier and really asserts
#           something. Verified by adding deliberately-bad tests and confirming
#           each was caught.
#   web   - the TypeScript typechecks and lints, and Vitest exercises the token
#           boundary plus every LiveKit data-channel event/reducer path.
#
# `contract` remains commented out below with the reason and the condition for
# restoring it. It is disabled rather than enabled so the gate never shows a
# pass it did not earn. The headless harness is now a real, blocking job.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: agent (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the version this project is actually developed on, so a green
        # run on 3.11/3.12 alone said nothing about the interpreter the code is
        # written against. Spike 0 verified the full dependency closure resolves
        # there - cp313 wheels exist throughout, no pin to 3.12 needed. See
        # docs/evidence/2026-09-17-spike0-environment.md.
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Typecheck
        # No type checker ran on either surface until now; docs/reviews flagged
        # that as an open risk. The config in pyproject.toml is deliberately a
        # starting point that is green on today's code, with each disabled
        # check named and justified there rather than blanket-suppressed.
        run: python -m mypy aiscelapeus
      - name: Generated docs are current
        # tests/audio/scenarios.yaml is the single source of truth for the voice
        # corpus; RECORDING-SCRIPT.md and docs/TESTS.md are rendered from it.
        # Without this step an edit to the oracle could ship while the script a
        # human records from still shows the old line - and the mismatch would
        # only surface as an unexplained assertion failure weeks later.
        run: python scripts/render_docs.py --check
      - name: Test
        # No .env.local on a runner, which is the point: the suite must be
        # hermetic rather than quietly depending on a developer's credentials.
        #
        # Note the audio corpus needs no special handling here: the scenario
        # suite reads scenarios.yaml and manifest.json only. librosa, soundfile
        # and the Deepgram call live in scripts/ behind the `audio` extra, which
        # is deliberately NOT installed above - so if that separation ever
        # breaks, this job fails on ImportError rather than silently pulling a
        # compiler toolchain into the gate.
        run: python -m pytest -q --cov=aiscelapeus --cov-report=term-missing

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      # Typecheck and lint assert something real about the current web code, so
      # they stay in the blocking gate.
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test

  # DISABLED: this job has no target on either side of the boundary.
  #
  # Verified by execution on 17 Sept 2026:
  #   - `pytest -q -m contract` in agent/ reports "367 deselected" and exits 5
  #     (NO_TESTS_COLLECTED). There is not one `@pytest.mark.contract` test in
  #     the repo; the marker is registered in pyproject.toml and never applied.
  #   - `npm run test:contract` in web/ matched zero files and passed only
  #     because of --passWithNoTests, which has now been removed.
  #
  # So the job asserted nothing about the Python/TypeScript golden-fixture
  # boundary it is named after. Enabling it as-is would make it red on every
  # run; leaving it as it was made it a green tick that proved nothing. Both
  # are worse than an honestly disabled job, so it is commented out until
  # golden fixtures exist.
  #
  # TODO: restore this job with the first `@pytest.mark.contract` test and the
  # first web/**/*.contract.test.ts. Nothing here needs rewriting - uncomment
  # it. The scripts it calls now fail correctly on an empty suite.
  #
  # contract:
  #   name: contract (golden fixtures)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.12"
  #         cache: pip
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: "20"
  #         cache: npm
  #         cache-dependency-path: web/package-lock.json
  #     - name: Install agent
  #       working-directory: agent
  #       run: python -m pip install -e ".[dev]"
  #     - name: Install web
  #       working-directory: web
  #       run: npm ci
  #     - name: Python writes and verifies goldens
  #       working-directory: agent
  #       run: python -m pytest -q -m contract
  #     - name: TypeScript parses every golden
  #       working-directory: web
  #       run: npm run test:contract

  meta:
    name: meta (falsifiability)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      # The step name used to promise "no untimed calls" as well. tests/meta
      # does not check that, so the claim is removed rather than left standing
      # over a check nobody wrote.
      - name: Every test names its falsifier; no vacuous asserts
        run: python -m pytest -q tests/meta

  # RESTORED 18 Sept 2026. This job was disabled because its target did not
  # exist, and it is back because B5 landed in f6c6b84: `aiscelapeus/harness.py`
  # plus `agent/scenarios/`. Verified locally before re-enabling - the command
  # below runs and exits 0 against the committed scenarios.
  #
  # The reason it was disabled rather than stubbed still stands and is worth
  # keeping in view: a fake harness exiting 0 over an empty directory would have
  # turned FR-013's latency claim into exactly the unearned green tick this
  # workflow's opening comment condemns. What makes it safe to enable now is
  # that the harness refuses to do that - it exits 2 on zero scenarios found,
  # because "a harness that reports success over zero scenarios is not evidence
  # of anything". The job therefore cannot pass vacuously if the directory is
  # ever emptied or mis-pathed.
  #
  # Exit codes, as implemented:
  #   0  every scenario passed
  #   1  a scenario failed, or the FR-013 budget was breached
  #   2  zero scenarios found, or a turn could not be interpreted
  #
  # `working-directory: agent` makes the relative `scenarios/` resolve to
  # agent/scenarios/ - NOT agent/tests/scenarios/, which is the voice corpus and
  # belongs to the `agent` job's pytest run.
  harness:
    name: harness (headless scenarios)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # Not `.[dev]`: the harness must work from a plain install, which is
        # what proves PyYAML is declared as the runtime dependency it is rather
        # than arriving through the dev extra. If that declaration regresses,
        # this step fails here instead of failing for whoever installs the
        # package.
        run: python -m pip install -e .
      - name: Scenarios
        # FR-013: the headless suite is green in <=120s or it is not green.
        # The harness asserts that bound internally as well; the timeout is the
        # outer guard for a hang rather than a slow pass.
        timeout-minutes: 3
        run: python -m aiscelapeus.harness --headless scenarios/
