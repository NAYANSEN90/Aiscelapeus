  #       working-directory: web
  #       run: npm run test:contract

  meta:
    name: meta (falsifiability)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      # The step name used to promise "no untimed calls" as well. tests/meta
      # does not check that, so the claim is removed rather than left standing
      # over a check nobody wrote.
      - name: Every test names its falsifier; no vacuous asserts
        run: python -m pytest -q tests/meta

  # DISABLED: this job's target does not exist yet.
  #
  # It invokes `python -m aiscelapeus.harness --headless scenarios/`. Neither
  # aiscelapeus/harness.py nor agent/scenarios/ is in the repo, so the job
  # fails on its first real run.
  #
  # The harness is B5 ("Headless scenario harness") in docs/BUILD-PLAN.md, and
  # B5 is NOT BUILT. It is deliberately left unstubbed: a fake harness that
  # exits 0 over an empty scenarios/ directory would turn FR-013's latency
  # claim into exactly the kind of unearned green tick this workflow's opening
  # comment condemns, and BUILD-PLAN.md notes B5 is what converts DESIGN.md §8's
  # BUILT claims "from assertion into evidence". A stub would convert them back.
