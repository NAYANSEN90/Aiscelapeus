name: aiscelapeus

services:
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: aiscelapeus-agent:local
    env_file:
      - path: ${AISCELAPEUS_ENV_FILE:-.env.local}
        required: true
    restart: unless-stopped
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: aiscelapeus-web:local
    env_file:
      - path: ${AISCELAPEUS_ENV_FILE:-.env.local}
        required: true
    environment:
      NODE_ENV: production
    ports:
      - "${AISCELAPEUS_WEB_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
